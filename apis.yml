apis:
- aid: pearson:pearson-developers-network
  name: Pearson Developers Network
  description: >-
    Pearson's named API program. Historically served the LearningStudio RESTful Course
    APIs, the SOAP SIS APIs, an eventing surface and a Financial Times Education API via
    api.pearson.com. The platform was retired and the portal is now gated: every
    documentation path returns HTTP 401 and SAML-redirects to a Salesforce Experience
    Cloud community. The gateway host api.pearson.com resolves but answers 403 on every
    path with "We apologize, you have reached a service that has been moved."
  humanURL: https://developer.pearson.com/
  image: https://www.pearson.com/media_11f626a45563a855db4c129c4851356069ff52ec8.png?width=1200&format=pjpg&optimize=medium
  baseURL: https://api.pearson.com
  x-status: retired
  x-base-url-note: >-
    api.pearson.com is the documented historical gateway host for this program. It
    resolves and responds, but returns 403 "service that has been moved" on every path.
    Recorded as-is rather than replaced with a guess; see lifecycle/pearson-lifecycle.yml.
  tags:
  - Learning Management
  - Education
  properties:
  - type: DeveloperPortal
    url: https://developer.pearson.com/
  - type: OpenIDConnect
    url: well-known/pearson-openid-configuration.json
  - type: Authentication
    url: authentication/pearson-authentication.yml
  - type: OAuthScopes
    url: scopes/pearson-scopes.yml
  - type: GitHubOrganization
    url: https://github.com/PearsonDevelopersNetwork
- aid: pearson:pearson-vue-web-services
  name: Pearson VUE Web Services
  description: >-
    The integration surface Pearson VUE offers test owners for candidate registration,
    scheduling and results delivery. ws.pearsonvue.com resolves and is a live Azure API
    Management gateway, answering unknown paths with a JSON
    {"statusCode": 404, "message": "Resource not found"} envelope. Pearson VUE publishes
    no contract, no discovery document and no anonymous technical documentation for it —
    access runs through a contracted test-owner engagement.
  humanURL: https://www.pearsonvue.com/us/en/test-owners.html
  image: https://www.pearson.com/media_11f626a45563a855db4c129c4851356069ff52ec8.png?width=1200&format=pjpg&optimize=medium
  baseURL: https://ws.pearsonvue.com
  x-status: gated
  tags:
  - Certification
  - Testing
  properties:
  - type: Documentation
    url: https://www.pearsonvue.com/us/en/test-owners.html
