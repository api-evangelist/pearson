aid: pearson
name: Pearson
url: https://raw.githubusercontent.com/api-evangelist/pearson/refs/heads/main/apis.yml
kind: company
position: Producing
description: >-
  Pearson plc is the world's largest learning company, operating courseware and
  assessment platforms (MyLab, Mastering, Revel, Pearson+, Learning Catalytics), UK and
  international qualifications (Edexcel, BTEC), clinical and school assessment
  businesses, Pearson Virtual Schools, English language learning, and Pearson VUE, the
  computer-based certification and licensure testing network. Pearson once ran a
  substantial public API program — the Pearson Developers Network, with RESTful
  LearningStudio Course APIs, SOAP SIS APIs, an eventing surface and first-party client
  libraries in five languages. That program is retired and closed: LearningStudio ended
  in 2018, eCollege shut down in 2023, api.pearson.com answers "service that has been
  moved", and developer.pearson.com returns 401 behind a Salesforce community. What
  remains public is an OIDC discovery document, a live status page, a security
  disclosure policy, LTI 1.3 guidance, and three retired SIS WSDLs.
