  detail: >-
    Every path on developer.pearson.com — the Pearson Developers Network, including the
    LearningStudio API reference, the available-APIs index and the authentication guide —
    answers HTTP 401 and SAML-redirects into Pearson's corporate Entra ID tenant and a
    Salesforce Experience Cloud community, while the program's gateway api.pearson.com
    returns 403 "We apologize, you have reached a service that has been moved."
