method: searched
source: >-
  npm registry search, PyPI, RubyGems and Packagist metadata endpoints, plus the
  PearsonDevelopersNetwork GitHub organization listing.
note: >-
  Pearson published five first-party client-library families for the LearningStudio APIs
  — PHP, Java, C#, Ruby and Python — plus HelloWorld starters in the same five languages.
  NONE of them was ever pushed to a language package registry: every one is distributed
  only as a GitHub repository, so there is no registry metadata endpoint to read a
  version from. They are recorded with `version: null` and a note, per the pipeline's
  "checked, nothing to record" rule.
  THE CURRENCY FINDING: the newest commit across the entire organization is 2016-09-23,
  and the API these libraries wrap was retired in 2018 and its gateway decommissioned
  (see lifecycle/pearson-lifecycle.yml). This is the strongest possible abandonment
  signal — a first-party SDK set that outlived the API it wraps by a decade without a
  single release.
  NO `SDKs` POINTER IS WIRED IN apis.yml. These are genuinely official Pearson client
  libraries, but they target a decommissioned endpoint (campusapi.ecollege.com is
  NXDOMAIN) and cannot be installed from any registry. Advertising them as a live SDK
  surface would be a false claim on Pearson's behalf. Only `type: Packages` is wired.

registries_searched:
  - registry: npm
    result: no first-party Pearson API SDK
    detail: >-
      A full-text search returns only statistics packages (Pearson correlation) and
      unrelated community work. The only genuinely Pearson-affiliated scope is
      @pearsonedunext (publisher edunextpearson, repos under github.com/Pearson-Advance):
      three Open edX React UI components — frontend-component-footer 13.1.0-post
      (2026-03-03), frontend-component-header 5.0.0-post.3 (2026-04-07),
      frontend-component-cookie-policy-banner 6.1.0 (2026-09-08). These are front-end
      components for a hosted Open edX distribution, not clients for a Pearson API, so
      they are not listed as SDKs below.
  - registry: pypi
