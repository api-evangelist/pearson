method: probed
source: >-
  Direct anonymous HTTP probes of the named /.well-known/ path list against every
  Pearson host this record knows, 2026-09-13.
note: >-
  One document was served: developer.pearson.com/.well-known/openid-configuration, a
  real OpenID Connect discovery document (issuer https://developer.pearson.com) for the
  identity provider that fronts the Pearson Developers Network portal. Every other path
  on every other host either 404s, or 401s behind the portal's SAML login. No
  security.txt is served anywhere — which is notable, because Pearson's own Responsible
  Security Disclosure Policy scopes itself to "Pearson products with a security.txt file
  in their root directory". status.pearson.com/security.txt answers 200 but the body is
  the Status Page SPA shell, not an RFC 9116 document, so it is recorded as a miss.
  ws.pearsonvue.com is an Azure API Management gateway that answers every unknown path
  with a JSON {"statusCode":404,"message":"Resource not found"} envelope.

