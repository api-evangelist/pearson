    as Pearson LearningStudio; these files are published in Pearson's own
    PearsonDevelopersNetwork organization (whose GitHub profile URL is
    developer.pearson.com) as the official "LearningStudio SIS API Libraries", and Pearson
    completed the eCollege platform shutdown in October 2023. The legacy namespace is the
    acquired platform's, and the publisher is Pearson.

